name: Build CodeInjector APK
on:
  push:
    paths:
      - '*.zip'
      - '**/*.zip'
      - 'settings.gradle*'
      - '**/settings.gradle*'
      - 'build.gradle*'
      - '**/build.gradle*'
      - 'app/**'
      - 'gradle/**'
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeinjector-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Python 3.11 (Chaquopy)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Encontrar e extrair projeto Android
        id: source
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$GITHUB_WORKSPACE"
          PROJECT_DIR=""

          # Caso os arquivos do projeto já estejam diretamente na raiz do repositório.
          if [[ -f "$WORKSPACE/settings.gradle.kts" || -f "$WORKSPACE/settings.gradle" ]]; then
            if [[ -d "$WORKSPACE/app" ]]; then
              PROJECT_DIR="$WORKSPACE"
            fi
          fi

          # Caso o projeto tenha sido enviado como ZIP, preferindo o nome esperado.
          if [[ -z "$PROJECT_DIR" ]]; then
            mapfile -d '' ARCHIVES < <(find "$WORKSPACE" -maxdepth 5 -type f -iname '*.zip' -not -path '*/.git/*' -print0)
            if [[ ${#ARCHIVES[@]} -eq 0 ]]; then
              echo '::error title=ZIP do projeto ausente::O repositório não contém nenhum arquivo ZIP com o projeto Android. Envie CodeInjectorPrimeiro.zip para a raiz do repositório e execute o workflow novamente.'
              echo 'Arquivos encontrados na raiz:'
              ls -la "$WORKSPACE"
              exit 1
            fi

            # Ordena CodeInjectorPrimeiro.zip primeiro; depois tenta os demais ZIPs.
            SORTED_ARCHIVES=()
            for archive in "${ARCHIVES[@]}"; do
              if [[ "$(basename "$archive")" == "CodeInjectorPrimeiro.zip" ]]; then
                SORTED_ARCHIVES=("$archive" "${SORTED_ARCHIVES[@]}")
              else
                SORTED_ARCHIVES+=("$archive")
              fi
            done

            for archive in "${SORTED_ARCHIVES[@]}"; do
              if ! unzip -Z1 "$archive" | grep -qE '(^|/)settings\.gradle(\.kts)?$'; then
                echo "Ignorando ZIP sem settings.gradle(.kts): $archive"
                continue
              fi

              DEST="$RUNNER_TEMP/codeinjector-source"
              rm -rf "$DEST"
              mkdir -p "$DEST"
              if ! unzip -oq "$archive" -d "$DEST"; then
                echo "::warning::Não foi possível extrair $archive; tentando outro ZIP."
                continue
              fi

              SETTINGS_FILE="$(find "$DEST" -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)"
              if [[ -n "$SETTINGS_FILE" ]]; then
                CANDIDATE_DIR="$(dirname "$SETTINGS_FILE")"
                if [[ -d "$CANDIDATE_DIR/app" && -f "$CANDIDATE_DIR/app/build.gradle.kts" || -d "$CANDIDATE_DIR/app" && -f "$CANDIDATE_DIR/app/build.gradle" ]]; then
                  PROJECT_DIR="$CANDIDATE_DIR"
                  echo "Projeto encontrado em: $archive"
                  break
                fi
              fi
              echo "ZIP não parece conter o módulo Android app: $archive"
            done
          fi

          if [[ -z "$PROJECT_DIR" ]]; then
            echo '::error title=Projeto Android não encontrado::Envie um ZIP que contenha settings.gradle(.kts) e app/build.gradle(.kts), ou coloque os arquivos do projeto diretamente na raiz do repositório.'
            exit 1
          fi

          if [[ ! -f "$PROJECT_DIR/gradlew" ]] && ! command -v gradle >/dev/null 2>&1; then
            echo 'Gradle será providenciado pela configuração do workflow.'
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Projeto selecionado: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Verificar estrutura do projeto
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          test -d app/src/main
          test -f app/build.gradle.kts -o -f app/build.gradle
          if [[ -f tools/verify_project.py ]]; then
            python tools/verify_project.py
          else
            echo 'Aviso: tools/verify_project.py não existe; validação estática específica ignorada.'
          fi

      - name: Remover declaração de serviço de acessibilidade, se existir
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path(os.environ['PROJECT_DIR'])
          manifest = root / 'app/src/main/AndroidManifest.xml'
          android_ns = '{http://schemas.android.com/apk/res/android}'

          if manifest.exists():
              tree = ET.parse(manifest)
              app = tree.getroot().find('application')
              changed = False
              if app is not None:
                  for service in list(app.findall('service')):
                      actions = [
                          action.get(android_ns + 'name')
                          for intent_filter in service.findall('intent-filter')
                          for action in intent_filter.findall('action')
                      ]
                      if 'android.accessibilityservice.AccessibilityService' in actions:
                          app.remove(service)
                          changed = True
              if changed:
                  tree.write(manifest, encoding='utf-8', xml_declaration=True)
                  print('Declaração de serviço de acessibilidade removida.')
              else:
                  print('Nenhuma declaração de serviço de acessibilidade encontrada.')

          config = root / 'app/src/main/res/xml/accessibility_service_config.xml'
          if config.exists():
              config.unlink()
              print('Arquivo de configuração do serviço de acessibilidade removido.')
          PY

      - name: Compilar APK Debug
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: CodeInjector-debug-apk
          path: ${{ steps.source.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
